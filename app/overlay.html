<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ghost Pointer overlay</title>
    <style>
      /* Every one of these matters. A stray background colour here paints an opaque sheet over
         the guest's entire desktop, and `pointer-events` is the belt to the backend's braces
         (`set_ignore_cursor_events`) — if either one fails the desktop stops taking clicks.
         No `cursor` rule, deliberately: a real Windows machine (1 Sep 2026) showed clicks going
         through to the desktop correctly while the system cursor itself stayed invisible the
         whole time the overlay was up — WebView2 appears to decide the cursor icon for its
         screen point independently of the `WS_EX_TRANSPARENT` click routing, so `cursor: none`
         here blanked it even though nothing was actually wrong with click-through. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
      }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
